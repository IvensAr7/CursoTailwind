<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Aula19 | Login</title>
</head>
<body class="bg-gray-100">
    <main class="flex flex-col items-center justify-center h-screen ">

    <div class="
        w-lg
        p-10
    ">
        <h2 class="font-bold text-lg text-center mb-4">Login</h2>
        <div class="bg-white shadow-md rounded-md p-6 space-y-4">
            <div>
                <label 
                    for="email"
                    class="text-sm text-gray-800"
                >E-mail</label>
                <input 
                    id="email"
                    type="text"
                    placeholder="Digite o e-mail"
                    class="
                        w-full 
                        px-2 py-1
                        bg-gray-100  
                        border border-gray-300 rounded 
                        text-md text-gray-600 
                        placeholder-gray-300 
                        focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50
                        transition duration-500 ease-in-out
                    "
                >
            </div>
            
            <div>
                <label 
                    for="password"
                    class="text-sm text-gray-800"
                >Senha</label>
                <input 
                    id="password"
                    type="password"
                    placeholder="Digite a senha"
                    class="
                        w-full 
                        px-2 py-1
                        bg-gray-100  
                        border border-gray-300 rounded 
                        text-md text-gray-600 
                        placeholder-gray-300 
                        focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50
                        transition duration-500 ease-in-out
                    "
                >
            </div>

            <div class="text-right">
                <a 
                    href="https://youtu.be/dQw4w9WgXcQ?si=AhU8lANkVl_7Yy_g"
                    target="_blank"
                    class="
                        transition duration-200
                        text-sm text-gray-300 hover:text-gray-400
                    "    
                >
                    Esqueci minha senha
                </a>
            </div>

            <div>
                <button class="bg-blue-500 px-6 py-2 rounded text-white shadow hover:bg-blue-600 text-sm w-full transition duration-300 ease-in-out">Login</button>
            </div>

        </div>
    </div>
    </main>



    


    <a href="aula20.html" class="p-2 border-2 bg-blue-400 mt-5 hover:bg-blue-300 block w-full">PROXIMA AULA</a>
    <a href="aula11-18.html" class="p-2 border-2 bg-red-400 mt-4 hover:bg-red-300 block w-full">ÚLTIMA AULA</a>
</body>
</html>
